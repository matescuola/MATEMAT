                        <p>La funzione composta è $h(x) = F(g(x))$. La sua derivata (regola della catena) è $h'(x) = F'(g(x)) \\cdot g'(x)$. Sostituendo $g(x)=2x^2$ e la sua derivata $g'(x)=4x$:</p>

                        <p><b>2. Volume cilindro massimo:</b> Facendo ruotare il rettangolo, l'altezza del cilindro è $x$ e il raggio di base è $y$. Il volume è $V(x) = \\pi y^2 x = \\pi \\left[\\frac{\\sqrt{3}}{2}(l-x)\\right]^2 x$. Sviluppando e derivando, otteniamo $V'(x) ανάλογη a 3x^2 - 4lx + l^2 = 0$. Le soluzioni sono $x=l$ (minimo) e $\\mathbf{x = \\frac{l}{3}}$ (massimo).</p>

                steps: [

                        id: 'q7',
                        title: "Soluzione",
                        content: `
                        <p><b>1. Continuità:</b> Uguagliamo limite sinistro e destro in $x=0$.<br>
                        $Sx: \\lim_{x \\to 0^-} \\frac{ax-b}{x+1} = -b$<br>
                        $Dx: \\lim_{x \\to 0^+} (x^2 - bx + a - 2) = a - 2$<br>
                        Quindi: $-b = a - 2 \\implies a + b = 2$.</p>
                        <p><b>2. Derivabilità:</b> Uguagliamo le derivate in $x=0$.<br>
                        $f'_{sx}(x) = \\frac{a(x+1) - (ax-b)(1)}{(x+1)^2} = \\frac{a+b}{(x+1)^2} \\implies f'_{sx}(0) = a + b$<br>
                        $f'_{dx}(x) = 2x - b \\implies f'_{dx}(0) = -b$<br>
                        Quindi: $a + b = -b \\implies a = -2b$. Sostituendo nella prima condizione otteniamo $-2b + b = 2 \\implies -b = 2 \\implies \\mathbf{b = -2}$. Di conseguenza $\\mathbf{a = 4}$.</p>
                        <p><b>3. Derivata seconda:</b> Sostituamo i parametri trovati ($a=4, b=-2$) nelle derivate prime:<br>
                        $f'_{sx}(x) = \\frac{4+(-2)}{(x+1)^2} = \\frac{2}{(x+1)^2} = 2(x+1)^{-2}$<br>
                        $f'_{dx}(x) = 2x - (-2) = 2x + 2$<br>
                        Derivando ancora per trovare la derivata seconda in un intorno di zero:<br>
                        $f''_{sx}(x) = -4(x+1)^{-3} \\implies \\lim_{x \\to 0^-} f''_{sx}(x) = -4$<br>
                        $f''_{dx}(x) = 2 \\implies \\lim_{x \\to 0^+} f''_{dx}(x) = 2$<br>
                        Essendo i limiti diversi ($-4 \\neq 2$), <b>la derivata seconda non esiste</b> in $x=0$ (la derivata prima presenta un "punto angoloso").</p>
                        `
                    }
                ]
            },
            Q8: {
                title: "Quesito 8",
                subtitle: "Geometria: Il Sangaku",
                icon: "calculator",
                iconClass: "w-6 h-6",
                text: "Nel quadrato ABCD di lato 5 cm, determina il lato del quadrato inscritto EFGH e il raggio della circonferenza tangente.",
                steps: [
                    {
                        id: 'q8',
                        title: "Soluzione",
                        content: `
                        <p><b>1. Lato del quadrato EFGH:</b> Sfruttando la simmetria lungo la diagonale $AC$, se chiamiamo $x$ il lato cercato, esso dista dal vertice $A$ la quantità $3x/2$ (si forma un triangolo isoscele, e sommiamo la distanza ai lati paralleli). Applicando Pitagora tra questo vertice, il punto medio del segmento sull'arco e il raggio (che vale 5 come il lato ABCD):<br>
                        $$ \\left(\\frac{x}{2}\\right)^2 + \\left(\\frac{3x}{2}\\right)^2 = 5^2 \\implies \\frac{10x^2}{4} = 25 \\implies \\mathbf{x = \\sqrt{10}} $$</p>
                        <p><b>2. Raggio della circonferenza:</b> La diagonale del quadrato grande è $5\\sqrt{2}$. La circonferenza è tangente ai lati nell'angolo $C$, quindi la distanza di $C$ dal centro $O$ della circonferenza è $r\\sqrt{2}$. La distanza del centro $O$ da $A$ è la somma dei raggi dell'arco grande e del piccolo: $5 + r$. Eguagliamo i segmenti sulla diagonale $AC$:<br>
                        $$ 5 + r = 5\\sqrt{2} - r\\sqrt{2} $$<br>
                        Raccogliendo $r$ e razionalizzando, si ottiene: $\\mathbf{r = 15 - 10\\sqrt{2}}$ cm.</p>
                        `
                    }
                ]
            }
        };

        const navItems = [
            { id: 'INTRO', label: 'Benvenuto' },
            { id: 'P1', label: 'Problema 1' },
            { id: 'P2', label: 'Problema 2' },
            { id: 'Q1', label: 'Quesito 1' },
            { id: 'Q2', label: 'Quesito 2' },
            { id: 'Q3', label: 'Quesito 3' },
            { id: 'Q4', label: 'Quesito 4' },
            { id: 'Q5', label: 'Quesito 5' },
            { id: 'Q6', label: 'Quesito 6' },
            { id: 'Q7', label: 'Quesito 7' },
            { id: 'Q8', label: 'Quesito 8' },
        ];

        // STATO DELL'APP
        let currentTab = 'INTRO';
        let expandedSteps = {}; // tiene traccia di quali step sono aperti (accordion)

        // ==========================================
        // FUNZIONI DI RENDER
        // ==========================================

        function renderSidebar() {
            const navContainer = document.getElementById('sidebar-nav');
            let html = '';
            
            navItems.forEach(item => {
                const isActive = item.id === currentTab;
                const baseClass = "snap-start whitespace-nowrap md:whitespace-normal text-left px-4 py-2.5 rounded-lg transition-colors flex items-center font-medium cursor-pointer";
                const activeClass = isActive ? "bg-blue-50 text-blue-700" : "text-slate-600 hover:bg-slate-100 hover:text-slate-900";
                
                html += `
                    <button onclick="changeTab('${item.id}')" class="${baseClass} ${activeClass}">
                        ${item.label}
                    </button>
                `;
            });
            
            navContainer.innerHTML = html;
        }

        function renderMainContent() {
            const data = examData[currentTab];
            
            // Header
            document.getElementById('header-title').textContent = data.title;
            document.getElementById('header-subtitle').textContent = data.subtitle;
            document.getElementById('header-icon-container').innerHTML = `<i data-lucide="${data.icon}" class="${data.iconClass}"></i>`;

            // Main Content Area
            const contentContainer = document.getElementById('main-content');
            let html = '';

            // Testo del problema/quesito
            if (data.text) {
                html += `
                <div class="bg-blue-50 border border-blue-100 rounded-2xl p-5 md:p-6 shadow-sm">
                    <h3 class="text-xs uppercase tracking-wider font-bold text-blue-800 mb-2">Testo</h3>
                    <div class="text-lg text-slate-800">${data.text}</div>
                </div>
                `;
            }

            // Contenuto Introduttivo (es. Benvenuto)
            if (data.content) {
                html += `
                <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200 mt-4">
                    ${data.content}
                </div>
                `;
            }

            // Passaggi di Risoluzione (Accordion)
            if (data.steps && data.steps.length > 0) {
                html += `
                <div class="space-y-4">
                    <h3 class="text-xl font-bold text-slate-800 mt-8 mb-4 flex items-center">
                        <i data-lucide="check-circle" class="w-5 h-5 mr-2 text-green-500"></i>
                        Passaggi di Risoluzione
                    </h3>
                `;

                data.steps.forEach(step => {
                    const isExpanded = !!expandedSteps[step.id];
                    const chevronIcon = isExpanded ? 'chevron-down' : 'chevron-right';
                    
                    html += `
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden transition-all duration-200">
                        <button onclick="toggleStep('${step.id}')" class="w-full flex items-center justify-between p-5 text-left bg-white hover:bg-slate-50 focus:outline-none cursor-pointer">
                            <span class="font-semibold text-lg text-slate-800">${step.title}</span>
                            <i data-lucide="${chevronIcon}" class="w-5 h-5 text-slate-400"></i>
                        </button>
                        
                        <div id="step-content-${step.id}" class="${isExpanded ? 'block' : 'hidden'} px-5 pb-6 pt-2 border-t border-slate-100">
                            <div class="prose prose-slate max-w-none math-content space-y-3">
                                ${step.content}
                            </div>
                    `;

                    if (step.tip) {
                        html += `
                            <div class="mt-5 bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start space-x-3">
                                <i data-lucide="lightbulb" class="w-6 h-6 text-amber-500 shrink-0 mt-0.5"></i>
                                <div>
                                    <h4 class="font-bold text-amber-800 text-sm uppercase tracking-wide">Il consiglio del prof</h4>
                                    <p class="text-amber-900 mt-1 font-medium">${step.tip}</p>
                                </div>
                            </div>
                        `;
                    }

                    html += `
                        </div>
                    </div>
                    `;
                });

                html += `</div>`;
            }

            contentContainer.innerHTML = html;

            // Re-inizializza le icone Lucide create nel DOM
            lucide.createIcons();

            // Richiede a MathJax di ri-processare la pagina per le formule
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(err => console.error('MathJax error:', err));
            }
        }

        // ==========================================
        // INTERAZIONI UTENTE
        // ==========================================

        function changeTab(tabId) {
            currentTab = tabId;
            expandedSteps = {}; // chiude tutti gli accordion quando si cambia pagina
            renderSidebar();
            renderMainContent();
            document.getElementById('main-scroll-area').scrollTop = 0; // Torna su
        }

        function toggleStep(stepId) {
            expandedSteps[stepId] = !expandedSteps[stepId];
            renderMainContent(); // Ri-renderizza per aggiornare icone e classi
        }

        // ==========================================
        // INIT DELL'APPLICAZIONE
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderMainContent();
        });
    </script>
</body>
